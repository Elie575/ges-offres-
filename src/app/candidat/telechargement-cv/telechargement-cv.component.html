

    <div class="upload-container">
            
            <form class="profile-form" (ngSubmit)="onSubmit()" [formGroup]="cvForm" enctype="multipart/form-data">
                <div class="profile-picture">
                  <img [src]="cv.photo || 'assets/bag.png'" style="background-color: rgb(249, 252, 253);"
                       alt="Ajouter photo" 
                       (click)="triggerFileInput()" />
                  <input type="file"  #fileInput accept="image/*" (change)="onPhotoChange($event)"  />
                </div>
            
            <div class="form-container">
                <h2>Créer votre CV</h2>

                    <!-- Profil professionnel -->
                    <div class="form-section">
                        <h3>Profil professionnel</h3>
                        <div class="form-group">
                            <label for="profil">Profil :</label>
                            <textarea id="profil" [(ngModel)]="cv.profil" formControlName="profil" rows="5" required></textarea>
                        </div>
                    </div>
            
                    
                    <!-- Expérience professionnelle -->
                    <div class="form-section">
                        <h3>Expérience professionnelle</h3>
                        <div formArrayName="experiences">
                            <div *ngFor="let experience of experiences.controls; let i = index" [formGroupName]="i">
                                <div class="form-group">
                                    <label for="entreprise-{{i}}">Entreprise :</label>
                                    <input type="text" [(ngModel)]="exper.entreprise" id="entreprise-{{i}}" formControlName="entreprise" required>
                                </div>
                                <div class="form-group">
                                    <label for="poste-{{i}}">Poste :</label>
                                    <input type="text" [(ngModel)]="exper.poste" id="poste-{{i}}" formControlName="poste" required>
                                </div>
                                <div class="form-group">
                                    <label for="dates-{{i}}">Dates :</label>
                                    <input type="text" [(ngModel)]="exper.dates"id="dates-{{i}}" formControlName="dates" required>
                                </div>
                                <div class="form-group">
                                    <label for="description-{{i}}">Description :</label>
                                    <textarea  [(ngModel)]="exper.description" id="description-{{i}}" formControlName="description" rows="3" required></textarea>
                                </div>
                                <button type="button" (click)="removeExperience(i)">Supprimer</button>
                            </div>
                        </div>
                        <button type="button" (click)="addExperience()">Ajouter une expérience</button>
                    </div>
                    
                    <!-- Formation et diplômes -->
                    <div class="form-section">
                        <h3>Formation et diplômes</h3>
                        <div formArrayName="formations">
                            <div *ngFor="let formation of formations.controls; let i = index" [formGroupName]="i">
                                <div class="form-group">
                                    <label for="etablissement-{{i}}">Établissement :</label>
                                    <input type="text"[(ngModel)]="format.etablissement" id="etablissement-{{i}}" formControlName="etablissement" required>
                                </div>
                                <div class="form-group">
                                    <label for="diplome-{{i}}">Diplôme :</label>
                                    <input type="text" [(ngModel)]="format.diplome"  id="diplome-{{i}}" formControlName="diplome" required>
                                </div>
                                <div class="form-group">
                                    <label for="dates-formation-{{i}}">Dates :</label>
                                    <input type="text" [(ngModel)]="format.dates"  id="dates-formation-{{i}}" formControlName="dates" required>
                                </div>
                                <button type="button" (click)="removeFormation(i)">Supprimer</button>
                            </div>
                        </div>
                        <button type="button" (click)="addFormation()">Ajouter une formation</button>
                    </div>
            
                    <!-- Compétences -->
                    <div class="form-section">
                        <h3>Compétences</h3>
                        <div formArrayName="competences">
                            <div *ngFor="let competence of competences.controls; let i = index">
                                <div class="form-group">
                                    <label for="competence-{{i}}">Compétence :</label>
                                    <input [(ngModel)]="comp.nom"type="text" id="competence-{{i}}" [formControlName]="i" required>
                                </div>
                                <button type="button" (click)="removeCompetence(i)">Supprimer</button>
                            </div>
                        </div>
                        <button type="button" (click)="addCompetence()">Ajouter une compétence</button>
                    </div>
             
                    <!-- Langues -->
                    <div class="form-section">
                        <h3>Langues</h3>
                        <div formArrayName="langues">
                            <div *ngFor="let langue of langues.controls; let i = index" [formGroupName]="i">
                                <div class="form-group">
                                    <label for="langue-{{i}}">Langue :</label>
                                    <input type="text" [(ngModel)]="lan.langue"id="langue-{{i}}" formControlName="langue" required>
                                </div>
                                <div class="form-group">
                                    <label for="niveau-{{i}}">Niveau :</label>
                                    <input type="text" [(ngModel)]="lan.niveau"id="niveau-{{i}}" formControlName="niveau" required>
                                </div>
                                <button type="button" (click)="removeLangue(i)">Supprimer</button>
                            </div>
                        </div>
                        <button type="button" (click)="addLangue()">Ajouter une langue</button>
                    </div>
            
                    <!-- Certifications -->
                    <div class="form-section">
                        <h3>Certifications</h3>
                        <div formArrayName="certifications">
                            <div *ngFor="let certification of certifications.controls; let i = index">
                                <div class="form-group">
                                    <label for="certification-{{i}}">Certification :</label>
                                    <input type="text" [(ngModel)]="cert.nom"id="certification-{{i}}" [formControlName]="i" required>
                                </div>
                                <button type="button" (click)="removeCertification(i)">Supprimer</button>
                            </div>
                        </div>
                        <button type="button" (click)="addCertification()">Ajouter une certification</button>
                    </div>
            
                    <button type="submit" (click)="ajoutcv()" style="width: 200px; margin-left: 350px;">Soumettre</button>
            </div>
            
    </form>
  </div>
